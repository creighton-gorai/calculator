<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <main>
        <div class="screen">80 + 9</div>
        <div class="keyboard">
            <button id="clear"><h1>AC</h1></button>
            <button id="delete"><h1>C</h1></button>
            <button id="modulo"><h1>%</h1></button>
            <button id="divide"><h1>/</h1></button>
            <button id="seven"><h1>7</h1></button>
            <button id="eight"><h1>8</h1></button>
            <button id="nine"><h1>9</h1></button>
            <button id="multiply"><h1>*</h1></button>
            <button id="four"><h1>4</h1></button>
            <button id="five"><h1>5</h1></button>
            <button id="six"><h1>6</h1></button>
            <button id="minus"><h1>-</h1></button>
            <button id="one"><h1>1</h1></button>
            <button id="two"><h1>2</h1></button>
            <button id="three"><h1>3</h1></button>
            <button id="plus"><h1>+</h1></button>
            <button id="blank" disabled></button>
            <button id="zero"><h1>0</h1></button>
            <button id="blank" disabled></button>
            <button id="equals"><h1>=</h1></button>
        </div>
    </main>
</body>
</html>
